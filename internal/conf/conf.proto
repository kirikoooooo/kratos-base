syntax = "proto3";

package kratos.api;

option go_package = "kratos-demo/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  AI ai = 3;
  Runtime runtime = 4;
}

message AI {
  message OpenAI {
    string api_key = 1;
    string base_url = 2;
    string model = 3;
    // 单次 chat/completions 请求超时（秒），含 TLS 握手；默认 120，网络慢可调大。
    int64 timeout_seconds = 4;
  }

  message DeepSeek {
    string api_key = 1;
    string base_url = 2;
    string model = 3;
    int64 timeout_seconds = 4;
  }

  OpenAI openai = 1;
  DeepSeek deepseek = 2;
  // LLM 厂商：openai / deepseek。默认 openai
  string provider = 3;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }

  message GRPC {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }

  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }

  message AgentMemory {
    string dir = 1;
    string user_id = 2;
    // 会话对话上下文字符数上限，超过则压缩。0=默认 200000；-1=关闭压缩。
    int64 context_compress_threshold = 3;
    // 压缩时保留的最近 turn 数（含 ai/tool）。
    int32 keep_recent_turns = 4;
    // 压缩时对单条 tool 观测结果保留的最大字符数。
    int32 tool_output_max_chars = 5;
  }

  Database database = 1;
  AgentMemory agent_memory = 2;
}

message Runtime {

  message MCPServer {

    message Environment {
      string key = 1;
      string value = 2;
    }

    // 唯一名称，仅用于日志和工具来源标识。
    string name = 1;
    // stdio MCP 服务启动命令，例如 uv。
    string command = 2;
    repeated string args = 3;
    // 初始化及单次工具调用超时（秒），默认 30。
    int64 timeout_seconds = 4;
    repeated Environment env = 5;
  }

  message RemoteAgent {
    string agent = 1;
    string target = 2;
    int64 timeout = 3;
  }

  repeated RemoteAgent remotes = 1;
  repeated MCPServer mcp_servers = 2;
}
