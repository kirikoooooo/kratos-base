syntax = "proto3";

package kratos.api;

option go_package = "kratos-demo/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  AI ai = 3;
  Runtime runtime = 4;
}

message AI {
  message OpenAI {
    string api_key = 1;
    string base_url = 2;
    string model = 3;
  }

  OpenAI openai = 1;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }

  message GRPC {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }

  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }

  Database database = 1;
}

message Runtime {
  message RemoteAgent {
    string agent = 1;
    string target = 2;
    int64 timeout = 3;
  }

  message Sandbox {
    bool enabled = 1;
    string api_key = 2;
    string base_url = 3;
    string template = 4;
    int64 timeout = 5;
    string skill_command = 6;
  }

  repeated RemoteAgent remotes = 1;
  Sandbox sandbox = 2;
}
