syntax = "proto3";

package kratos.api;

option go_package = "kratos-demo/internal/conf;conf";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  AI ai = 3;
}

message AI {
  message OpenAI {
    string api_key = 1;
    string base_url = 2;
    string model = 3;
  }

  OpenAI openai = 1;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }

  message GRPC {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }

  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }

  Database database = 1;
}
